server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # style-src allows 'unsafe-inline' on purpose: users' own text-spacing / readability bookmarklets inject
    # inline styles (WCAG 1.4.12), and the app renders no user-supplied HTML. Scripts stay 'self' only.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy $csp always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    # SPA fallback; index.html is always revalidated so new deployments are picked up.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/ /index.html;
    }
}
